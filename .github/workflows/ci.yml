name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup show active-toolchain

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run format check
        run: cargo fmt --check

      - name: Run cargo check
        run: cargo check --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install test dependencies
        env:
          RIPGREP_VERSION: "14.1.1"
          FD_VERSION: "v10.2.0"
        run: |
          set -euo pipefail

          # Static binaries from GitHub Releases: the Ubuntu mirrors are not
          # reachable on every runner, and the apt install of ripgrep/fd was
          # failing for that reason.
          install_tool() {
            local url="$1" pattern="$2" target="$3"
            local tmp
            tmp="$(mktemp -d)"
            curl -fsSL --retry 5 --retry-all-errors -o "$tmp/tool.tar.gz" "$url"
            tar -xzf "$tmp/tool.tar.gz" -C "$tmp"
            local binary
            binary="$(find "$tmp" -type f -name "$pattern" -perm -u+x -print -quit)"
            sudo install -m 0755 "$binary" "/usr/local/bin/$target"
            rm -rf "$tmp"
          }

          install_tool \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            rg rg
          install_tool \
            "https://github.com/sharkdp/fd/releases/download/${FD_VERSION}/fd-${FD_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            fd fd

          rg --version
          fd --version
          command -v python3

      - name: Run tests
        run: cargo test

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Print coverage summary
        run: cargo llvm-cov --summary-only

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Check vulnerabilities
        # rustls 0.22.x and rustls-webpki 0.102.x (serenity transitive deps) have
        # unfixable advisories. serenity 0.12.x pins tokio-tungstenite 0.21 ->
        # rustls 0.22 -> rustls-webpki 0.102.
        run: cargo audit --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0346 --ignore RUSTSEC-2026-0349 --ignore RUSTSEC-2026-0382

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses, bans, advisories
        run: cargo deny check

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Run tests (UTC)
        env:
          TZ: UTC
        run: npm --prefix web test

      - name: Run tests (Asia/Tokyo)
        env:
          TZ: Asia/Tokyo
        run: npm --prefix web test

      - name: Build
        run: npm --prefix web run build
