name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup show active-toolchain

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run format check
        run: cargo fmt --check

      - name: Run cargo check
        run: cargo check --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep python3
          sudo ln -sf $(which fdfind) /usr/local/bin/fd

      - name: Run tests
        run: cargo test

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Print coverage summary
        run: cargo llvm-cov --summary-only

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Check vulnerabilities
        # rustls 0.22.x and rustls-webpki 0.102.x (serenity transitive deps) have
        # unfixable advisories. serenity 0.12.x pins tokio-tungstenite 0.21 ->
        # rustls 0.22 -> rustls-webpki 0.102.
        run: cargo audit --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0346 --ignore RUSTSEC-2026-0349 --ignore RUSTSEC-2026-0382 --ignore RUSTSEC-2026-0009

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses, bans, advisories
        run: cargo deny check

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Run tests (UTC)
        env:
          TZ: UTC
        run: npm --prefix web test

      - name: Run tests (Asia/Tokyo)
        env:
          TZ: Asia/Tokyo
        run: npm --prefix web test

      - name: Build
        run: npm --prefix web run build
