name: Release

# Releases are driven by the version in Cargo.toml. After a CI run on `main`
# succeeds, the workflow compares Cargo.toml's version against the latest
# release tag. If the version changed, it builds and publishes a new release
# (tag v<version>); otherwise nothing happens. Merging a version bump is the
# release action, so merges without a bump never release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Release workflows must run sequentially so each run compares against the
# latest published release.
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  compute-version:
    name: Compute Release Version

    # Only release commits whose CI run actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      head_sha: ${{ steps.version.outputs.head_sha }}

    steps:
      - name: Resolve CI head SHA
        id: sha
        run: echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout CI SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.head_sha }}
          persist-credentials: false

      - name: Compute release tag or skip
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HEAD_SHA="${{ steps.sha.outputs.head_sha }}"
          VERSION=$(
            grep -m1 '^version' Cargo.toml |
              sed 's/version = "//;s/"//'
          )
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml version '${VERSION}' must be MAJOR.MINOR.PATCH (CalVer), e.g. 2026.8.1"
            exit 1
          fi

          RELEASED_TAG=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name' 2>/dev/null || true
          )

          if [ "v${VERSION}" = "${RELEASED_TAG}" ]; then
            echo "Version ${VERSION} already released as ${RELEASED_TAG}; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v${VERSION} (previous: ${RELEASED_TAG:-none})"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

  build-web:
    name: Build Web Assets
    needs: [compute-version]
    if: ${{ needs.compute-version.outputs.skip != 'true' && needs.compute-version.outputs.tag != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.compute-version.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded web assets
        env:
          EGOPULSE_RELEASE_TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: web/dist
          if-no-files-found: error

  build-assets:
    name: Build ${{ matrix.target.label }}
    runs-on: ${{ matrix.target.os }}
    needs: [compute-version, build-web]
    if: ${{ needs.compute-version.outputs.skip != 'true' && needs.compute-version.outputs.tag != '' }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - label: linux-x86_64
            os: ubuntu-latest
            bin: egopulse
            target_triple: x86_64-unknown-linux-gnu
            asset_triple: x86_64-unknown-linux-gnu

          - label: linux-arm64
            os: ubuntu-24.04-arm
            bin: egopulse
            target_triple: aarch64-unknown-linux-gnu
            asset_triple: aarch64-unknown-linux-gnu

          - label: macos-arm64
            os: macos-14
            bin: egopulse
            target_triple: aarch64-apple-darwin
            asset_triple: aarch64-apple-darwin

    steps:
      - name: Checkout CI SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.compute-version.outputs.head_sha }}
          persist-credentials: false

      - name: Download web assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: web/dist

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.target_triple }}

      - name: Build release binary
        shell: bash
        env:
          EGOPULSE_RELEASE_TAG: ${{ needs.compute-version.outputs.tag }}
        run: cargo build --release

      - name: Package archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          ASSET_NAME="egopulse-${RELEASE_VERSION}-${{ matrix.target.asset_triple }}.tar.gz"
          tar -czf "${ASSET_NAME}" \
            -C target/release \
            "${{ matrix.target.bin }}"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.label }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [compute-version, build-assets]
    if: ${{ needs.compute-version.outputs.skip != 'true' && needs.compute-version.outputs.tag != '' }}

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ needs.compute-version.outputs.tag }}
      HEAD_SHA: ${{ needs.compute-version.outputs.head_sha }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; re-uploading assets"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --target "${HEAD_SHA}"
          fi

          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            dist/*.tar.gz \
            dist/SHA256SUMS.txt \
            --clobber
